<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Amit Kumar Shukla - Solution Architect & Senior Technical Lead</title>
  <meta name="description" content="Executive Resume of Amit Kumar Shukla - Senior Technical Lead & Solution Architect with 20+ years of experience." />
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- html2pdf Library for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-body: #090d16;
      --bg-surface: #111827;
      --bg-card: #1f293d;
      --bg-card-hover: #26334d;
      --bg-accent-subtle: rgba(59, 130, 246, 0.12);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      
      --border-color: #334155;
      --border-light: #1e293b;
      
      --gradient-brand: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
      --gradient-card: linear-gradient(180deg, rgba(31,41,61,0.8) 0%, rgba(17,24,39,0.9) 100%);
      
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
      
      --chip-bg: rgba(59, 130, 246, 0.12);
      --chip-text: #60a5fa;
      --chip-border: rgba(96, 165, 250, 0.25);
      
      --sidebar-width: 310px;
    }

    [data-theme="light"] {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-accent-subtle: #eff6ff;
      
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      
      --accent-blue: #2563eb;
      --accent-cyan: #0891b2;
      --accent-emerald: #059669;
      --accent-purple: #7c3aed;
      --accent-amber: #d97706;
      
      --border-color: #cbd5e1;
      --border-light: #e2e8f0;
      
      --gradient-brand: linear-gradient(135deg, #0891b2 0%, #2563eb 50%, #7c3aed 100%);
      --gradient-card: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 8px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
      
      --chip-bg: #eff6ff;
      --chip-text: #1d4ed8;
      --chip-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Outfit', sans-serif;
    }

    code, .font-mono {
      font-family: 'Fira Code', monospace;
    }

    /* Top Action Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .top-bar-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand-avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-blue);
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 340px;
    }

    .search-input {
      width: 100%;
      padding: 0.45rem 0.85rem 0.45rem 2.2rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      text-decoration: none;
      min-height: 38px;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-blue);
    }

    .btn-primary {
      background: var(--gradient-brand);
      color: #ffffff;
      border: none;
    }

    /* Mobile Nav Bar Strip */
    .mobile-nav-strip {
      display: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      white-space: nowrap;
      padding: 0.5rem 1rem;
    }
    
    .mobile-nav-chip {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      margin-right: 0.4rem;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      text-decoration: none;
    }
    
    .mobile-nav-chip.active {
      background: var(--gradient-brand);
      color: #ffffff;
      border-color: transparent;
    }

    /* Main App Layout */
    .app-layout {
      max-width: 1400px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    /* Sidebar Navigation */
    .sidebar {
      position: sticky;
      top: 4.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem 1.25rem;
      box-shadow: var(--shadow-md);
    }

    .profile-header-card {
      text-align: center;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.25rem;
    }

    .profile-photo-lg {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-blue);
      box-shadow: var(--shadow-md);
      margin: 0 auto 0.85rem auto;
      display: block;
    }

    .profile-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .profile-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent-cyan);
      margin-top: 0.25rem;
    }

    .contact-links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      font-size: 0.85rem;
      margin-top: 1rem;
    }

    .contact-links-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .contact-links-list a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }

    .toc-nav {
      margin-top: 1.25rem;
    }

    .toc-nav-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .toc-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .toc-links a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .toc-links a:hover, .toc-links a.active {
      background: var(--bg-accent-subtle);
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* Main Content Area */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* Hero Summary & Key Metrics Banner */
    .hero-banner {
      background: var(--gradient-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .hero-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-brand);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.85rem;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.85rem;
      text-align: center;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent-blue);
      font-family: 'Outfit', sans-serif;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.2rem;
    }

    /* Section Cards */
    .content-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border-color);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-title svg {
      width: 22px;
      height: 22px;
      color: var(--accent-blue);
    }

    /* Executive Summary Text */
    .summary-p {
      margin-bottom: 1rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .summary-p:last-child {
      margin-bottom: 0;
    }

    /* Skills Grid & Filters */
    .skill-filters {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .skill-filter-btn {
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .skill-filter-btn.active, .skill-filter-btn:hover {
      background: var(--gradient-brand);
      color: #ffffff;
      border-color: transparent;
    }

    .skills-category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.1rem;
    }

    .skill-cat-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.1rem;
    }

    .skill-cat-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 0.75rem;
    }

    .skill-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .skill-pill {
      background: var(--chip-bg);
      color: var(--chip-text);
      border: 1px solid var(--chip-border);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* Experience Timeline */
    .timeline-wrapper {
      position: relative;
      padding-left: 1.25rem;
    }

    .timeline-wrapper::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: var(--border-color);
    }

    .role-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .role-card::before {
      content: '';
      position: absolute;
      left: -1.68rem;
      top: 1.5rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: 2px solid var(--bg-surface);
      box-shadow: 0 0 0 2px var(--accent-blue);
    }

    .role-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.65rem;
    }

    .role-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .company-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-blue);
    }

    .role-dates {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.65rem;
      background: var(--chip-bg);
      color: var(--chip-text);
      border-radius: 12px;
      border: 1px solid var(--chip-border);
    }

    .project-banner {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin: 0.5rem 0;
      padding: 0.35rem 0.75rem;
      background: rgba(6, 182, 212, 0.08);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 0 6px 6px 0;
    }

    .role-details p {
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.65;
      margin-bottom: 0.55rem;
    }

    .role-details ul {
      list-style-type: none;
      margin-top: 0.55rem;
      margin-bottom: 0.75rem;
    }

    .role-details li {
      position: relative;
      padding-left: 1.2rem;
      margin-bottom: 0.5rem;
      font-size: 0.91rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .role-details li::before {
      content: '▹';
      position: absolute;
      left: 0;
      color: var(--accent-blue);
      font-weight: bold;
    }

    .customization-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      margin: 0.75rem 0;
    }

    .customization-box-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-amber);
      margin-bottom: 0.35rem;
    }

    .role-tech-stack {
      margin-top: 0.85rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }

    .tech-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-right: 0.25rem;
      text-transform: uppercase;
    }

    /* Certifications Grid */
    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .cert-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cert-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--chip-bg);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .cert-info h4 {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .cert-info p {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Education Grid */
    .edu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .edu-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.1rem;
    }

    .edu-degree {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .edu-inst {
      font-size: 0.85rem;
      color: var(--accent-blue);
      margin-top: 0.2rem;
    }

    .edu-year {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border-color);
      margin-top: 2.5rem;
    }

    /* Responsive Breakpoints & Mobile Optimization */
    @media (max-width: 1024px) {
      .app-layout {
        grid-template-columns: 1fr;
        padding: 0 1rem;
        margin: 1rem auto;
      }
      .sidebar {
        position: relative;
        top: 0;
        margin-bottom: 1rem;
      }
      .mobile-nav-strip {
        display: block;
      }
      .toc-nav {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .top-bar-inner {
        padding: 0.6rem 0.85rem;
        gap: 0.5rem;
      }
      .brand-name {
        font-size: 0.98rem;
      }
      .search-box {
        max-width: 160px;
      }
      .btn {
        padding: 0.4rem 0.6rem;
        font-size: 0.78rem;
      }
      .btn-text-full {
        display: none;
      }
      .hero-banner, .content-card {
        padding: 1.25rem;
      }
      .metrics-grid {
        grid-template-columns: 1fr 1fr;
      }
      .role-card {
        padding: 1.1rem;
      }
    }

    @media (max-width: 480px) {
      .top-bar-inner {
        flex-wrap: wrap;
      }
      .search-box {
        max-width: 100%;
        width: 100%;
        order: 3;
      }
      .action-btns {
        margin-left: auto;
      }
      .metrics-grid {
        grid-template-columns: 1fr;
      }
      .skills-category-grid, .certs-grid, .edu-grid {
        grid-template-columns: 1fr;
      }
      .timeline-wrapper {
        padding-left: 0.85rem;
      }
      .role-card::before {
        left: -1.28rem;
      }
    }

    /* Print Stylesheet */
    @media print {
      @page {
        margin: 10mm;
        size: letter;
      }

      body {
        background: #ffffff !important;
        color: #0f172a !important;
        font-size: 9.5pt;
      }

      .top-bar, .mobile-nav-strip, .sidebar, .skill-filters, .btn {
        display: none !important;
      }

      .app-layout {
        display: block !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .content-card, .hero-banner, .role-card, .skill-cat-box, .cert-card, .edu-card, .metric-card {
        background: #ffffff !important;
        color: #0f172a !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
      }

      .hero-banner {
        padding: 1rem !important;
        margin-bottom: 1rem !important;
      }

      .role-card {
        page-break-inside: avoid;
        margin-bottom: 1rem !important;
        padding: 1rem !important;
      }

      .timeline-wrapper::before, .role-card::before {
        display: none !important;
      }

      .timeline-wrapper {
        padding-left: 0 !important;
      }

      .role-title {
        color: #0f172a !important;
      }

      .company-name {
        color: #1d4ed8 !important;
      }

      .project-banner {
        background: #f1f5f9 !important;
        color: #0369a1 !important;
        border-left-color: #0284c7 !important;
      }

      .skill-pill, .role-dates {
        background: #f1f5f9 !important;
        color: #334155 !important;
        border: 1px solid #cbd5e1 !important;
      }

      footer {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Action Bar -->
  <header class="top-bar">
