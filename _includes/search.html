<div class="search-modal" id="search-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
  <div class="search-modal-backdrop" id="search-backdrop"></div>
  <div class="search-modal-box">
    <div class="search-modal-header">
      <i class="fa-solid fa-magnifying-glass search-modal-icon"></i>
      <input 
        type="text" 
        id="search-input" 
        class="search-modal-input" 
        placeholder="Search articles by topic, Java, Spring, Microservices..." 
        autocomplete="off" 
        spellcheck="false"
      >
      <button class="search-modal-close" id="search-modal-close" aria-label="Close search">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="search-modal-status" id="search-status">
      <span class="search-hint">Type to start searching... Press <kbd>ESC</kbd> to exit</span>
    </div>

    <div class="search-modal-results" id="search-results">
      <!-- Search results will be rendered here dynamically -->
    </div>

    <div class="search-modal-footer">
      <div class="search-shortcuts">
        <span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span>
        <span><kbd>↵</kbd> to select</span>
        <span><kbd>ESC</kbd> to close</span>
      </div>
    </div>
  </div>
</div>
